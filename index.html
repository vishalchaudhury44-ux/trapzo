<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trapzo</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#000;
position:sticky;
top:0;
z-index:1000;
}

.menu-btn,.cart-btn{
font-size:13px;
background:#00ff88;
color:black;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.logo{
color:#00ff88;
font-size:18px;
font-weight:bold;
}

#search{
width:100%;
padding:8px;
border:none;
outline:none;
}

/* MENU */
.menu{
position:fixed;
top:0;
left:-260px;
width:260px;
height:100%;
background:#111;
padding:20px;
transition:.3s;
z-index:1200;
}
.menu.active{left:0;}

.menu a{
display:block;
margin:12px 0;
cursor:pointer;
}

/* CART */
.cart{
position:fixed;
top:0;
right:-100%;
width:85%;
max-width:320px;
height:100%;
background:#111;
padding:15px;
transition:.4s;
z-index:1300;
overflow:auto;
border-left:2px solid #00ff88;
}
.cart.active{right:0;}

/* OVERLAY */
#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
z-index:1100;
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:#111;
padding:10px;
border-radius:10px;
text-align:center;
border:1px solid #00ff88;
cursor:pointer;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
}

button{
background:#00ff88;
border:none;
padding:8px;
margin:3px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

/* PRODUCT VIEW */
.product-view{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:2000;
display:none;
padding:20px;
}

.product-view img{
width:100%;
max-height:300px;
object-fit:cover;
}

/* SIZE */
.size-btn{
padding:5px 10px;
border:1px solid #00ff88;
margin:3px;
display:inline-block;
cursor:pointer;
}
.size-btn.active{
background:#00ff88;
color:black;
}

</style>
</head>

<body>

<header>
<div class="menu-btn" onclick="toggleMenu()">☰ MENU</div>
<div class="logo">TRAPZO</div>
<div class="cart-btn" onclick="toggleCart()">🛒 (<span id="count">0</span>)</div>
</header>

<input id="search" placeholder="Search product...">

<!-- MENU -->
<div class="menu" id="menu">
<h3>MENU</h3>
<a onclick="filter('all')">Home</a>
<a onclick="filter('tshirt')">T-Shirt</a>

<hr>

<a href="https://wa.me/919007757293">WhatsApp Help</a>
<a href="tel:9007757293">Call Support</a>
</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- PRODUCT VIEW -->
<div class="product-view" id="view">
<span onclick="closeView()">❌ Close</span>
<img id="viewImg">
<h2 id="viewName"></h2>
<p id="viewPrice"></p>

<h3>Select Size</h3>
<div id="sizes">
<span class="size-btn" onclick="selectSize(this)">S</span>
<span class="size-btn" onclick="selectSize(this)">M</span>
<span class="size-btn" onclick="selectSize(this)">L</span>
<span class="size-btn" onclick="selectSize(this)">XL</span>
</div>

<button onclick="addFromView()">Add to Cart</button>
</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeAll()"></div>

<!-- CART -->
<div class="cart" id="cart">
<h2>Cart <span onclick="closeAll()">❌</span></h2>

<div id="cartItems"></div>
<h3 id="total"></h3>

<h4>Scan & Pay</h4>
<img width="200"
src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=9007757293@kotakbank&pn=TRAPZO&cu=INR">

<button onclick="payNow()">Pay Online</button>
<button onclick="whatsappOrder()">WhatsApp Order</button>
</div>

<script>

let products=[
{name:"No Rules",price:399,cat:"tshirt",img:"no-rules.jpg"},
{name:"Spiderman",price:399,cat:"tshirt",img:"spiderman.jpg"},
{name:"Universe",price:399,cat:"tshirt",img:"universe.jpg"},
{name:"Starboy",price:399,cat:"tshirt",img:"starboy.jpg"},
{name:"Anime",price:399,cat:"tshirt",img:"anime.jpg"},
{name:"Built Different",price:399,cat:"tshirt",img:"built-different.jpg"},
{name:"Girlfriend",price:399,cat:"tshirt",img:"girlfriend.jpg"}
];
let cart=[];
let selectedProduct=null;
let selectedSize="M";

/* SHOW PRODUCTS */
function show(list){
let html="";
list.forEach((p,i)=>{
html+=`
<div class="card" onclick="openView(${i})">
<img src="${p.img}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
</div>`;
});
document.getElementById("products").innerHTML=html;
}
show(products);

/* SEARCH */
document.getElementById("search").onkeyup=function(){
let val=this.value.toLowerCase();
show(products.filter(p=>p.name.toLowerCase().includes(val)));
}

/* FILTER */
function filter(cat){
if(cat=="all"){show(products);}
else{show(products.filter(p=>p.cat==cat));}
closeAll();
}

/* PRODUCT VIEW */
function openView(i){
selectedProduct=products[i];
document.getElementById("view").style.display="block";
document.getElementById("viewImg").src=products[i].img;
document.getElementById("viewName").innerText=products[i].name;
document.getElementById("viewPrice").innerText="₹"+products[i].price;
}

function closeView(){
document.getElementById("view").style.display="none";
}

/* SIZE */
function selectSize(el){
document.querySelectorAll(".size-btn").forEach(b=>b.classList.remove("active"));
el.classList.add("active");
selectedSize=el.innerText;
}

/* ADD FROM VIEW */
function addFromView(){
let item=cart.find(p=>p.name==selectedProduct.name && p.size==selectedSize);

if(item){item.qty++;}
else{cart.push({...selectedProduct,qty:1,size:selectedSize});}

update();
closeView();
}

/* CART */
function toggleCart(){
document.getElementById("cart").classList.toggle("active");
document.getElementById("overlay").style.display="block";
}

function toggleMenu(){
document.getElementById("menu").classList.toggle("active");
document.getElementById("overlay").style.display="block";
}

function closeAll(){
document.getElementById("menu").classList.remove("active");
document.getElementById("cart").classList.remove("active");
document.getElementById("overlay").style.display="none";
}

/* UPDATE CART */
function update(){
let html="";let total=0;

cart.forEach((p,i)=>{
total+=p.price*p.qty;

html+=`
<div>
${p.name} (${p.size}) ₹${p.price}<br>
<button onclick="qty(${i},-1)">-</button>
${p.qty}
<button onclick="qty(${i},1)">+</button><br>
<button onclick="removeItem(${i})">Remove</button>
<hr>
</div>`;
});

document.getElementById("cartItems").innerHTML=html;
document.getElementById("total").innerText="Total ₹"+total;
document.getElementById("count").innerText=cart.length;
}

/* QTY */
function qty(i,v){
cart[i].qty+=v;
if(cart[i].qty<=0){cart.splice(i,1);}
update();
}

/* REMOVE */
function removeItem(i){
cart.splice(i,1);
update();
}

/* PAYMENT */
function payNow(){
alert("Scan QR and pay, then send screenshot on WhatsApp");
}

/* WHATSAPP */
function whatsappOrder(){
let msg="Order:%0A";
cart.forEach(p=>{
msg+=p.name+" "+p.size+" x"+p.qty+"%0A";
});
window.open("https://wa.me/919007757293?text="+msg);
}

</script>

</body>
</html>
